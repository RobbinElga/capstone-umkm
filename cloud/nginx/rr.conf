# Algoritma: Round Robin
log_format lb_log '$remote_addr - [$time_local] "$request" $status rt=$request_time upstream=$upstream_addr urt=$upstream_response_time';
access_log /var/log/nginx/access.log lb_log;

upstream app_backend {
    # Round Robin adalah default - tidak perlu direktif khusus
    server app1:3000;
    server app2:3000;
}

server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://app_backend/health;
    }
}